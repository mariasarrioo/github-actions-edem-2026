name: Welcome to the party (fourth)

on:
  workflow_dispatch:
    inputs:
      thename:
        description: 'What is your name'
        required: true
        type: string

jobs:
  say_hello:
    name: "Let's greet the user!"
    runs-on: ubuntu-latest
    steps:
      - id: get-time
        name: Grab the current time
        run: |
          curTime=$(date)
          echo "currenttime=${curTime}" >> "$GITHUB_OUTPUT"
      - name: Greet the user
        run: echo "Hello ${{ inputs.thename }}! The time is ${{ steps.get-time.outputs.currenttime }}"
